onboarding = false
[keys]
prefix = "ctrl+s"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical    = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
edit_scrollback = "prefix+shift+e"  # frees prefix+e for the nvim sidebar
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

status_indicators = "symbols"
[ui.toast]
delivery = "terminal"

[ui.sidebar.agents]
row_gap = 0
rows = [
  ["state_icon", "$title"],
  ["agent", "$limit"],
  ["$context"],
]

# Plugin keys sit behind the prefix: WezTerm takes ctrl+shift+u/m itself, and without the kitty
# keyboard protocol other ctrl+shift+letter chords arrive as plain ctrl+letter.
[[keys.command]]
key = "prefix+u"
type = "plugin_action"
command = "usagebar.open-limits"
description = "Agent Usage: open limits pane"

[[keys.command]]
key = "prefix+shift+u"
type = "plugin_action"
command = "usagebar.refresh"
description = "Agent Usage: refresh sidebar meters"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "chmarax.herdr-nvim.toggle"
description = "nvim sidebar"

[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "chmarax.herdr-nvim.pick-file"
description = "open file from agent output"

[[keys.command]]
key = "prefix+d"
type = "plugin_action"
command = "chmarax.gitview.toggle"
description = "git view sidebar"

[[keys.command]]
key = "prefix+ctrl+d"
type = "plugin_action"
command = "chmarax.gitview.toggle-tab"
description = "git view tab"

[theme]
name = "catppuccin"
auto_switch = false
